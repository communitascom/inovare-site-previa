  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--gelo);color:var(--ink);display:flex;flex-direction:column;min-height:100vh}

  #btn{font:600 15px 'Barlow',sans-serif;letter-spacing:.02em;height:44px;border:0;background:var(--pet);color:#fff;cursor:pointer}

  #err{min-height:18px;font-size:13px;margin-top:12px;color:var(--muted)}
  #err.bad{color:var(--bad)}

  <h1>Prévia do site</h1>
  <p>Protótipo para aprovação da estrutura · acesso por PIN</p>
  <form id="form" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="PIN" aria-label="PIN de acesso">
    <button type="submit" id="btn">Entrar</button>
  </form>
  <div id="err" role="status"></div>
</div></main>
<div class="cr">por Communitas</div>
<script>
(function(){
  var ITER=310000;
  var err=document.getElementById('err'), btn=document.getElementById('btn'), inp=document.getElementById('pin');
  function say(m,bad){err.textContent=m||'';err.className=bad?'bad':''}
  async function unlock(pin){
    btn.disabled=true; say('Abrindo a prévia...');
    var buf;
    try{var r=await fetch('dados.enc?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('rede');buf=new Uint8Array(await r.arrayBuffer())}
    catch(e){say('Não foi possível carregar a prévia. Tente de novo.',true);btn.disabled=false;return}
    try{
      var salt=buf.slice(0,16), iv=buf.slice(16,28), ct=buf.slice(28);
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
      try{sessionStorage.setItem('inovare_pin',pin)}catch(e){}
      document.open();document.write(html);document.close();
    }catch(e){
      try{sessionStorage.removeItem('inovare_pin')}catch(_){}
      say('PIN incorreto.',true);btn.disabled=false;inp.value='';inp.focus();
    }
  }
  document.getElementById('form').addEventListener('submit',function(ev){ev.preventDefault();var v=inp.value.trim();if(v)unlock(v)});
  var saved=null;try{saved=sessionStorage.getItem('inovare_pin')}catch(e){}
  if(saved){unlock(saved)}else{inp.focus()}
})();
</script>
